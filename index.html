<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving Licence Generator</title>
    <!-- Librería para convertir la tarjeta en imagen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Fuente manuscrita similar a la de la referencia -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e2f0d9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: #e2f0d9;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            background-color: #70ad47;
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            border-radius: 5px 5px 0 0;
            margin: -20px -20px 20px -20px;
        }

        .header span {
            margin-right: 15px;
            cursor: pointer;
        }

        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* Formulario */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            color: #d965a0;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .form-group input[type="text"] {
            width: 100%;
            border: none;
            border-bottom: 1px solid #d965a0;
            background: transparent;
            padding: 5px 0;
            font-size: 16px;
            outline: none;
        }

        .form-group input[type="file"] {
            font-size: 14px;
            color: #555;
            padding: 5px 0;
            width: 100%;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #70ad47;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }

        /* --- CREDENCIAL IDÉNTICA A LA REFERENCIA --- */
        .card-preview-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .id-card {
            width: 360px;
            height: 225px;
            /* Usamos la textura gráfica exacta de fondo de la tarjeta de referencia */
            background-image: url('https://i.ibb.co/3Wf4b7Z/card-bg-ref.png'); /* Base texturizada */
            background-color: #a4c2f4;
            background-size: cover;
            background-position: center;
            border: 2px solid #2c3e50;
            border-radius: 12px;
            position: relative;
            box-sizing: border-box;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            overflow: hidden;
            font-family: 'Caveat', cursive; /* Fuente manuscrita idéntica a la app original */
        }

        /* Título superior idéntico */
        .id-title-container {
            position: absolute;
            top: 14px;
            left: 20px;
            right: 20px;
            text-align: center;
            border-bottom: 2px solid #222;
            padding-bottom: 2px;
        }

        .id-title-text {
            font-size: 18px;
            font-weight: bold;
            color: #111;
            letter-spacing: 1px;
        }
        .id-title-text span {
            font-weight: normal;
        }

        /* Foto de la credencial */
        .id-photo-box {
            position: absolute;
            top: 55px;
            left: 20px;
            width: 85px;
            height: 105px;
            border: 1.5px solid #222;
            background: #ccc;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #444;
            font-family: Arial, sans-serif;
        }

        /* Campos de texto alineados exactamente como en la foto */
        .field-name { position: absolute; top: 58px; left: 120px; font-size: 20px; color: #111; }
        .field-dob { position: absolute; top: 88px; left: 120px; font-size: 20px; color: #111; }
        .field-address { position: absolute; top: 118px; left: 120px; font-size: 20px; color: #111; width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .field-mobile { position: absolute; top: 148px; left: 120px; font-size: 20px; color: #111; }

        .field-country { position: absolute; top: 172px; left: 20px; font-size: 19px; color: #111; }
        .field-issue { position: absolute; top: 195px; left: 20px; font-size: 19px; color: #111; }
        .field-expiry { position: absolute; top: 195px; left: 180px; font-size: 19px; color: #111; }

        /* Sello VERIFIED con estrellas idéntico a la referencia */
        .verified-badge {
            position: absolute;
            bottom: 5px;
            right: 10px;
            width: 125px;
            height: 125px;
            pointer-events: none;
            opacity: 0.85;
        }

        /* Botón Circular Único */
        .action-buttons {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .circle-btn {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background-color: #92d050;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .circle-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PANTALLA 1: FORMULARIO -->
    <div id="screen-form" class="screen active">
        <div class="header">Driving Licence</div>
        <form id="licenseForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="inputName" required placeholder="Ej. Jose Lopez">
            </div>
            <div class="form-group">
                <label>Date of Birth</label>
                <input type="text" id="inputDob" required placeholder="DD/MM/YYYY">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="inputAddress" required placeholder="Street 23 St">
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" id="inputMobile" required placeholder="5322362536">
            </div>
            <div class="form-group">
                <label>Country</label>
                <input type="text" id="inputCountry" required placeholder="München">
            </div>
            <div class="form-group">
                <label>Issue Date</label>
                <input type="text" id="inputIssue" required placeholder="01/01/2025">
            </div>
            <div class="form-group">
                <label>Expiry Date</label>
                <input type="text" id="inputExpiry" required placeholder="01/01/2030">
            </div>
            <div class="form-group">
                <label>Foto de perfil (Galería)</label>
                <input type="file" id="inputPhoto" accept="image/*">
            </div>
            <button type="submit" class="btn-primary">DONE</button>
        </form>
    </div>

    <!-- PANTALLA 2: VISTA PREVIA Y GUARDAR -->
    <div id="screen-preview" class="screen">
        <div class="header">
            <span onclick="goBack()">←</span> Save Image
        </div>
        
        <div class="card-preview-container">
            <div class="id-card" id="cardCapture">
                <!-- Título principal -->
                <div class="id-title-container">
                    <div class="id-title-text">DRIVER LICENSE <span>INTERNATIONAL</span></div>
                </div>

                <!-- Foto -->
                <div id="photoContainer" class="id-photo-box">Sin foto</div>

                <!-- Campos de texto posicionados exactamente como en la muestra -->
                <div class="field-name"><strong>Name:</strong> <span id="prevName"></span></div>
                <div class="field-dob"><strong>DOB:</strong> <span id="prevDob"></span></div>
                <div class="field-address"><strong>Address:</strong> <span id="prevAddress"></span></div>
                <div class="field-mobile"><strong>Mobile No:</strong> <span id="prevMobile"></span></div>

                <div class="field-country"><strong>Country:</strong> <span id="prevCountry"></span></div>
                <div class="field-issue"><strong>Issue:</strong> <span id="prevIssue"></span></div>
                <div class="field-expiry"><strong>Expiry:</strong> <span id="prevExpiry"></span></div>

                <!-- Sello VERIFIED SVG idéntico con estrellas y texto curvo -->
                <svg class="verified-badge" viewBox="0 0 150 150">
                    <defs>
                        <path id="curvePath" d="M 20, 75 a 55,55 0 1,1 110,0 a 55,55 0 1,1 -110,0" />
                    </defs>
                    <circle cx="75" cy="75" r="58" fill="none" stroke="#355b99" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
                    <circle cx="75" cy="75" r="50" fill="none" stroke="#355b99" stroke-width="1.5" opacity="0.7"/>
                    <!-- Estrellas y texto curvado -->
                    <text font-size="11" fill="#355b99" font-weight="bold" opacity="0.8">
                        <textPath href="#curvePath" startOffset="0%">★ VERIFIED ★ VERIFIED ★ VERIFIED</textPath>
                    </text>
                    <text x="75" y="80" font-size="18" font-weight="bold" fill="#355b99" text-anchor="middle" letter-spacing="2" transform="rotate(-20 75 75)">VERIFIED</text>
                </svg>
            </div>
        </div>

        <div class="action-buttons">
            <button class="circle-btn" onclick="saveImage()">Save</button>
        </div>
    </div>
</div>

<script>
    let uploadedPhotoUrl = '';

    document.getElementById('inputPhoto').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            uploadedPhotoUrl = URL.createObjectURL(file);
        }
    });

    document.getElementById('licenseForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        document.getElementById('prevName').innerText = document.getElementById('inputName').value;
        document.getElementById('prevDob').innerText = document.getElementById('inputDob').value;
        document.getElementById('prevAddress').innerText = document.getElementById('inputAddress').value;
        document.getElementById('prevMobile').innerText = document.getElementById('inputMobile').value;
        document.getElementById('prevCountry').innerText = document.getElementById('inputCountry').value;
        document.getElementById('prevIssue').innerText = document.getElementById('inputIssue').value;
        document.getElementById('prevExpiry').innerText = document.getElementById('inputExpiry').value;
        
        const photoContainer = document.getElementById('photoContainer');
        if (uploadedPhotoUrl) {
            photoContainer.innerHTML = `<img src="${uploadedPhotoUrl}" style="width:100%; height:100%; object-fit:cover;">`;
        } else {
            photoContainer.innerHTML = "Sin foto";
        }

        document.getElementById('screen-form').classList.remove('active');
        document.getElementById('screen-preview').classList.add('active');
    });

    function goBack() {
        document.getElementById('screen-preview').classList.remove('active');
        document.getElementById('screen-form').classList.add('active');
    }

    function saveImage() {
        const card = document.getElementById('cardCapture');
        html2canvas(card, { scale: 3, useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'driving-licence.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>

</body>
</html>

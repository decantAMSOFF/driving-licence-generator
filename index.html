<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving Licence Generator</title>
    <!-- Librería para convertir la tarjeta en imagen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e2f0d9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: #e2f0d9;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            background-color: #70ad47;
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            border-radius: 5px 5px 0 0;
            margin: -20px -20px 20px -20px;
        }

        .header span {
            margin-right: 15px;
            cursor: pointer;
        }

        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* Formulario */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            color: #d965a0;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .form-group input[type="text"] {
            width: 100%;
            border: none;
            border-bottom: 1px solid #d965a0;
            background: transparent;
            padding: 5px 0;
            font-size: 16px;
            outline: none;
        }

        .form-group input[type="file"] {
            font-size: 14px;
            color: #555;
            padding: 5px 0;
            width: 100%;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #70ad47;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }

        /* --- DISEÑO IDÉNTICO DE LA TARJETA --- */
        .card-preview-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .id-card {
            width: 340px;
            height: 210px;
            /* Fondo azulado degradado con textura simulada */
            background: linear-gradient(135deg, #a4c2f4 0%, #d8e5f8 50%, #8ab4f8 100%);
            border: 2px solid #3a506b;
            border-radius: 12px;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        /* Sello de VERIFIED al fondo de la tarjeta */
        .verified-stamp {
            position: absolute;
            right: 10px;
            bottom: 15px;
            width: 110px;
            height: 110px;
            border: 2px dashed rgba(53, 91, 153, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(53, 91, 153, 0.35);
            font-weight: bold;
            font-size: 14px;
            transform: rotate(-25deg);
            pointer-events: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: inset 0 0 10px rgba(53, 91, 153, 0.2);
        }

        .id-title {
            font-size: 11px;
            font-weight: bold;
            text-align: left;
            border-bottom: 1.5px solid #222;
            padding-bottom: 2px;
            margin-bottom: 8px;
            color: #111;
            letter-spacing: 0.5px;
        }

        .id-title span {
            font-style: italic;
            font-weight: normal;
        }

        .id-content {
            display: flex;
            gap: 10px;
            position: relative;
            z-index: 2;
        }

        .id-photo {
            width: 75px;
            height: 95px;
            background: #cccccc;
            border: 1px solid #444;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #444;
            text-align: center;
        }

        .id-details {
            font-size: 11px;
            color: #1a1a1a;
            line-height: 1.4;
            flex: 1;
        }

        .id-details div {
            margin-bottom: 1px;
        }

        .id-details strong {
            color: #000;
        }

        /* Botón Circular Único */
        .action-buttons {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .circle-btn {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background-color: #92d050;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .circle-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PANTALLA 1: FORMULARIO -->
    <div id="screen-form" class="screen active">
        <div class="header">Driving Licence</div>
        <form id="licenseForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="inputName" required placeholder="Ej. Jose Lopez">
            </div>
            <div class="form-group">
                <label>Date of Birth</label>
                <input type="text" id="inputDob" required placeholder="DD/MM/YYYY">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="inputAddress" required placeholder="Street 23 St">
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" id="inputMobile" required placeholder="5322362536">
            </div>
            <div class="form-group">
                <label>Country</label>
                <input type="text" id="inputCountry" required placeholder="München">
            </div>
            <div class="form-group">
                <label>Issue Date</label>
                <input type="text" id="inputIssue" required placeholder="01/01/2025">
            </div>
            <div class="form-group">
                <label>Expiry Date</label>
                <input type="text" id="inputExpiry" required placeholder="01/01/2030">
            </div>
            <div class="form-group">
                <label>Foto de perfil (Galería)</label>
                <input type="file" id="inputPhoto" accept="image/*">
            </div>
            <button type="submit" class="btn-primary">DONE</button>
        </form>
    </div>

    <!-- PANTALLA 2: VISTA PREVIA Y GUARDAR -->
    <div id="screen-preview" class="screen">
        <div class="header">
            <span onclick="goBack()">←</span> Save Image
        </div>
        
        <div class="card-preview-container">
            <div class="id-card" id="cardCapture">
                <div class="verified-stamp">VERIFIED</div>
                <div class="id-title">DRIVER LICENSE <span>INTERNATIONAL</span></div>
                <div class="id-content">
                    <div id="photoContainer" class="id-photo">Sin foto</div>
                    <div class="id-details">
                        <div><strong>Name:</strong> <span id="prevName"></span></div>
                        <div><strong>DOB:</strong> <span id="prevDob"></span></div>
                        <div><strong>Address:</strong> <span id="prevAddress"></span></div>
                        <div><strong>Mobile No:</strong> <span id="prevMobile"></span></div>
                        <div style="margin-top: 6px;"><strong>Country:</strong> <span id="prevCountry"></span></div>
                        <div><strong>Issue:</strong> <span id="prevIssue"></span></div>
                        <div><strong>Expiry:</strong> <span id="prevExpiry"></span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="circle-btn" onclick="saveImage()">Save</button>
        </div>
    </div>
</div>

<script>
    let uploadedPhotoUrl = '';

    // Capturar correctamente la imagen seleccionada de la galería
    document.getElementById('inputPhoto').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            uploadedPhotoUrl = URL.createObjectURL(file);
        }
    });

    document.getElementById('licenseForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        document.getElementById('prevName').innerText = document.getElementById('inputName').value;
        document.getElementById('prevDob').innerText = document.getElementById('inputDob').value;
        document.getElementById('prevAddress').innerText = document.getElementById('inputAddress').value;
        document.getElementById('prevMobile').innerText = document.getElementById('inputMobile').value;
        document.getElementById('prevCountry').innerText = document.getElementById('inputCountry').value;
        document.getElementById('prevIssue').innerText = document.getElementById('inputIssue').value;
        document.getElementById('prevExpiry').innerText = document.getElementById('inputExpiry').value;
        
        const photoContainer = document.getElementById('photoContainer');
        if (uploadedPhotoUrl) {
            photoContainer.innerHTML = `<img src="${uploadedPhotoUrl}" style="width:100%; height:100%; object-fit:cover;">`;
        } else {
            photoContainer.innerHTML = "Sin foto";
        }

        document.getElementById('screen-form').classList.remove('active');
        document.getElementById('screen-preview').classList.add('active');
    });

    function goBack() {
        document.getElementById('screen-preview').classList.remove('active');
        document.getElementById('screen-form').classList.add('active');
    }

    function saveImage() {
        const card = document.getElementById('cardCapture');
        html2canvas(card, { scale: 3, useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'driving-licence.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>

</body>
</html>

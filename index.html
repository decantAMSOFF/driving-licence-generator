<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving Licence Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e2f0d9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: #e2f0d9;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            background-color: #70ad47;
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            border-radius: 5px 5px 0 0;
            margin: -20px -20px 20px -20px;
        }

        .header span {
            margin-right: 15px;
            cursor: pointer;
        }

        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }

        /* Formulario */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            color: #d965a0;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .form-group input[type="text"] {
            width: 100%;
            border: none;
            border-bottom: 1px solid #d965a0;
            background: transparent;
            padding: 5px 0;
            font-size: 16px;
            outline: none;
        }

        .form-group input[type="file"] {
            font-size: 14px;
            color: #555;
            padding: 5px 0;
            width: 100%;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #70ad47;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }

        /* --- CREDENCIAL IDÉNTICA A LA REFERENCIA --- */
        .card-preview-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .id-card {
            width: 350px;
            height: 220px;
            background: linear-gradient(135deg, #b8d2f5 0%, #ffffff 60%, #9bc2ef 100%);
            border: 2px solid #2c3e50;
            border-radius: 12px;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* Capa de tramas de seguridad de fondo (líneas finas simulando patrones de seguridad) */
        .security-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(45deg, rgba(44, 62, 80, 0.04) 0, rgba(44, 62, 80, 0.04) 1px, transparent 0, transparent 50%),
                              radial-gradient(circle at 80% 80%, rgba(41, 128, 185, 0.15) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        /* Sello de VERIFIED con círculo de estrellas idéntico a la referencia */
        .verified-seal {
            position: absolute;
            right: -10px;
            bottom: -15px;
            width: 130px;
            height: 130px;
            pointer-events: none;
            z-index: 2;
            opacity: 0.65;
        }

        .id-title-bar {
            position: relative;
            z-index: 3;
            border-bottom: 2px solid #1a252f;
            padding-bottom: 3px;
            margin-bottom: 8px;
        }

        .id-title {
            font-size: 12px;
            font-weight: bold;
            color: #1a252f;
            letter-spacing: 0.5px;
        }

        .id-title span {
            font-style: italic;
            font-weight: normal;
        }

        .id-content {
            display: flex;
            gap: 10px;
            position: relative;
            z-index: 3;
        }

        .id-photo {
            width: 78px;
            height: 98px;
            background: #dcdcdc;
            border: 1.5px solid #2c3e50;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #555;
            text-align: center;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.15);
        }

        .id-details {
            font-size: 11px;
            color: #111;
            line-height: 1.4;
            flex: 1;
        }

        .id-details div {
            margin-bottom: 1px;
        }

        .id-details strong {
            color: #000;
        }

        /* Botón Circular Único */
        .action-buttons {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .circle-btn {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background-color: #92d050;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .circle-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PANTALLA 1: FORMULARIO -->
    <div id="screen-form" class="screen active">
        <div class="header">Driving Licence</div>
        <form id="licenseForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="inputName" required placeholder="Ej. Jose Lopez">
            </div>
            <div class="form-group">
                <label>Date of Birth</label>
                <input type="text" id="inputDob" required placeholder="DD/MM/YYYY">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="inputAddress" required placeholder="Street 23 St">
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" id="inputMobile" required placeholder="5322362536">
            </div>
            <div class="form-group">
                <label>Country</label>
                <input type="text" id="inputCountry" required placeholder="München">
            </div>
            <div class="form-group">
                <label>Issue Date</label>
                <input type="text" id="inputIssue" required placeholder="01/01/2025">
            </div>
            <div class="form-group">
                <label>Expiry Date</label>
                <input type="text" id="inputExpiry" required placeholder="01/01/2030">
            </div>
            <div class="form-group">
                <label>Foto de perfil (Galería)</label>
                <input type="file" id="inputPhoto" accept="image/*">
            </div>
            <button type="submit" class="btn-primary">DONE</button>
        </form>
    </div>

    <!-- PANTALLA 2: VISTA PREVIA Y GUARDAR -->
    <div id="screen-preview" class="screen">
        <div class="header">
            <span onclick="goBack()">←</span> Save Image
        </div>
        
        <div class="card-preview-container">
            <div class="id-card" id="cardCapture">
                <!-- Patrón de seguridad de fondo -->
                <div class="security-pattern"></div>

                <!-- Sello circular de VERIFIED con diseño de estrellas idéntico -->
                <svg class="verified-seal" viewBox="0 0 120 120">
                    <defs>
                        <path id="circlePath" d="M 15, 60 a 45,45 0 1,1 90,0 a 45,45 0 1,1 -90,0" />
                    </defs>
                    <circle cx="60" cy="60" r="48" fill="none" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="3,3" />
                    <circle cx="60" cy="60" r="42" fill="none" stroke="#2980b9" stroke-width="1" />
                    <!-- Estrellas decorativas alrededor del sello -->
                    <text font-size="10" fill="#2980b9" font-weight="bold">
                        <textPath href="#circlePath" startOffset="0%">★ VERIFIED ★ VERIFIED ★ VERIFIED</textPath>
                    </text>
                    <text x="60" y="64" font-size="13" font-weight="bold" fill="#2980b9" text-anchor="middle" letter-spacing="1.5" transform="rotate(-15 60 60)">VERIFIED</text>
                </svg>

                <div class="id-title-bar">
                    <div class="id-title">DRIVER LICENSE <span>INTERNATIONAL</span></div>
                </div>

                <div class="id-content">
                    <div id="photoContainer" class="id-photo">Sin foto</div>
                    <div class="id-details">
                        <div><strong>Name:</strong> <span id="prevName"></span></div>
                        <div><strong>DOB:</strong> <span id="prevDob"></span></div>
                        <div><strong>Address:</strong> <span id="prevAddress"></span></div>
                        <div><strong>Mobile No:</strong> <span id="prevMobile"></span></div>
                        <div style="margin-top: 4px;"><strong>Country:</strong> <span id="prevCountry"></span></div>
                        <div><strong>Issue:</strong> <span id="prevIssue"></span></div>
                        <div><strong>Expiry:</strong> <span id="prevExpiry"></span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="circle-btn" onclick="saveImage()">Save</button>
        </div>
    </div>
</div>

<script>
    let uploadedPhotoUrl = '';

    document.getElementById('inputPhoto').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            uploadedPhotoUrl = URL.createObjectURL(file);
        }
    });

    document.getElementById('licenseForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        document.getElementById('prevName').innerText = document.getElementById('inputName').value;
        document.getElementById('prevDob').innerText = document.getElementById('inputDob').value;
        document.getElementById('prevAddress').innerText = document.getElementById('inputAddress').value;
        document.getElementById('prevMobile').innerText = document.getElementById('inputMobile').value;
        document.getElementById('prevCountry').innerText = document.getElementById('inputCountry').value;
        document.getElementById('prevIssue').innerText = document.getElementById('inputIssue').value;
        document.getElementById('prevExpiry').innerText = document.getElementById('inputExpiry').value;
        
        const photoContainer = document.getElementById('photoContainer');
        if (uploadedPhotoUrl) {
            photoContainer.innerHTML = `<img src="${uploadedPhotoUrl}" style="width:100%; height:100%; object-fit:cover;">`;
        } else {
            photoContainer.innerHTML = "Sin foto";
        }

        document.getElementById('screen-form').classList.remove('active');
        document.getElementById('screen-preview').classList.add('active');
    });

    function goBack() {
        document.getElementById('screen-preview').classList.remove('active');
        document.getElementById('screen-form').classList.add('active');
    }

    function saveImage() {
        const card = document.getElementById('cardCapture');
        html2canvas(card, { scale: 3, useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'driving-licence.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>

</body>
</html>
